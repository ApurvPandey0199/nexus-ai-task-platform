apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexus-ai-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/nexus-ai/platform-infra.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: nexus-ai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
