apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-worker
  namespace: nexus-ai
  labels:
    app: nexus-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-worker
  template:
    metadata:
      labels:
        app: nexus-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/nexus-ai/worker:latest
          imagePullPolicy: Always
          env:
            - name: API_URL
              value: "http://nexus-backend-service:3001"
          envFrom:
            - configMapRef:
                name: nexus-config
            - secretRef:
                name: nexus-secrets
          resources:
            requests:
              cpu: "150m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
