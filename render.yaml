services:
  - type: web
    name: nexus-ai-task-platform
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_HOST
        value: localhost
      - key: REDIS_PORT
        value: 6379
